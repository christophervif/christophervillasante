media:
  input: images/uploads
  output: /images/uploads

content:
  - name: social
    label: LinkedIn & Contact
    type: file
    path: data/site.json
    fields:
      - name: linkedin_url
        label: LinkedIn profile URL
        type: string
      - name: linkedin_posts
        label: Featured LinkedIn posts (paste each post's link)
        type: string
        list: true

  - name: projects
    label: Projects
    type: file
    path: data/projects.json
    fields:
      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - name: title
            label: Title (EN)
            type: string
          - name: title_es
            label: Título (ES)
            type: string
            required: false
          - name: kind
            label: Category (EN)
            type: string
          - name: kind_es
            label: Categoría (ES)
            type: string
            required: false
          - name: description
            label: Description (EN)
            type: text
          - name: description_es
            label: Descripción (ES)
            type: text
            required: false
          - name: tags
            label: Tags
            type: string
            list: true
          - name: image
            label: Image
            type: image
            required: false
          - name: link
            label: External link
            type: string
            required: false
